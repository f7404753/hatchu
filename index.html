<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手術物品 発注</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4E6D8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="発注">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="app-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#F4F6F9;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;color:#1a2230}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
  iframe{display:block;border:0;width:100%;height:100%}
  .msg{max-width:520px;margin:15vh auto 0;padding:24px;text-align:center;line-height:1.8}
  .msg img{width:96px;height:96px;border-radius:22px}
  @media (prefers-color-scheme:dark){html,body{background:#0E1824;color:#E6EDF5}}
</style>
</head>
<body>
<noscript><div class="msg">このページを表示するには、JavaScriptを有効にしてください。</div></noscript>
<script>
/* このページは入口です。URLの後ろに付いた情報（?a=…）から、アプリを中に表示します。
   アプリのURLや合言葉はこのファイルには書かれていません。 */
(function(){
  var p=new URLSearchParams(location.search);
  var a=p.get("a")||"", v=p.get("v")||"";
  if(!/^[A-Za-z0-9_-]{20,200}$/.test(a)||(v&&!/^[A-Za-z0-9]{10,100}$/.test(v))){
    document.body.innerHTML='<div class="msg"><img src="app-icon-192.png" alt=""><p>このページは、発注アプリに表示されている<br>「スタッフ用のURL」または「業者様用のURL」から開いてください。</p></div>';
    return;
  }
  if(v){document.title="発注依頼（業者様用）";}
  var f=document.createElement("iframe");
  f.src="https://script.google.com/macros/s/"+a+"/exec"+(v?"?v="+encodeURIComponent(v):"");
  f.title=document.title;
  f.setAttribute("allow","clipboard-write; camera");
  f.setAttribute("referrerpolicy","no-referrer");
  document.body.appendChild(f);
})();
</script>
</body>
</html>
